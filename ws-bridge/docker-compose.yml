# Weather Station Bridge: recibe una o varias estaciones meteorologicas —Ecowitt, Wunderground
# o JSON— y las reparte a los servicios que quieras.
#
#     cp .env.ejemplo .env      y cambiá lo que necesites
#     docker compose up -d
#
# En un Synology: Container Manager -> Proyecto -> Crear, apuntando a esta carpeta.
#
# TODO SALE DEL .env, CON VALORES POR DEFECTO. Se puede levantar sin escribir una sola variable
# y funciona; y se puede cambiar el puerto, la ruta de los datos, el usuario y el broker sin
# tocar este archivo. Es la diferencia entre un proyecto que anda en la casa de quien lo
# escribió y uno que anda en la de cualquiera.
#
# NO LLEVA network_mode: host. Las estaciones mandan a un puerto TCP normal —no hay
# descubrimiento ni broadcast— así que alcanza con publicarlo, y es bastante menos invasivo que
# compartir la red entera de la máquina.

services:
  ecowitt:
    build: .
    image: ws-bridge:local
    container_name: ${NOMBRE_CONTENEDOR:-ws-bridge}
    restart: always

    # QUIEN CORRE EL PROCESO. Por defecto root, que baja solo a un usuario sin privilegios en el
    # arranque después de acomodar el dueño del volumen (ver entrada.sh). Si tu sistema no deja
    # hacer ese chown, poné UID_DATOS y GID_DATOS en el .env y corre directo con ellos.
    user: "${UID_DATOS:-0}:${GID_DATOS:-0}"

    ports:
      # UNA SOLA VARIABLE PARA UNA SOLA DECISION. Antes eran dos —PUERTO_HOST y PUERTO— para
      # elegir lo mismo, y se podian poner distintas sin que nada avisara.
      #
      # Adentro del contenedor el puerto es siempre 8088 y no hace falta tocarlo: nadie mas vive
      # ahi adentro. Lo unico que se elige es por donde se lo publica afuera.
      - "${PUERTO:-8088}:8088"

    volumes:
      # LO UNICO PERSISTENTE. El código va dentro de la imagen, no montado: el contenedor no
      # tiene por qué poder reescribir su propio programa.
      - ${RUTA_DATOS:-./datos}:/app/datos

    environment:
      # El de adentro, fijo. El de afuera se elige arriba.
      - PUERTO=8088
      - ARCHIVO=/app/datos
      - TZ=${TZ:-UTC}

      # El administrador inicial. Ver .env.ejemplo: sólo se aplican si todavía no hay usuarios.
      - ADMIN_USUARIO=${ADMIN_USUARIO:-}
      - ADMIN_CLAVE=${ADMIN_CLAVE:-}
      - ADMIN_RESET=${ADMIN_RESET:-}
      - PANEL_ABIERTO=${PANEL_ABIERTO:-}

      # Home Assistant, opcional. Sin esto el puente funciona igual: recibe, archiva y reparte.
      - MQTT_HOST=${MQTT_HOST:-}
      - MQTT_PUERTO=${MQTT_PUERTO:-1883}
      - MQTT_USUARIO=${MQTT_USUARIO:-}
      - MQTT_CLAVE=${MQTT_CLAVE:-}
      - RAIZ_MQTT=${RAIZ_MQTT:-estacion}
      - PREFIJO_HA=${PREFIJO_HA:-homeassistant}
      - NOMBRE_NODO=${NOMBRE_NODO:-Weather Station Bridge}

      # Modos de prueba.
      - SECO=${SECO:-}
      - SIN_MQTT=${SIN_MQTT:-}

    # NO SE ANULA EL REGISTRO, y la primera versión de este archivo sí lo hacía.
    #
    # Poner `logging: driver: json-file` parecía prolijo —evita que un envío por minuto llene el
    # volumen— pero el 01/09/2026 tuvo un costo que no valía la pena: con el driver cambiado,
    # **la pestaña Registro de Container Manager aparece vacía**. El contenedor se moría en
    # bucle y la única pista posible estaba justamente ahí.
    #
    # Un registro que no se puede leer no sirve de nada. La rotación la maneja el sistema.
