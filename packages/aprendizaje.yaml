# Aprendizaje continuo de los tiempos de movimiento.
#
# Hasta ahora los minutos de espera de cada ambiente estaban escritos adentro de
# cada automatizacion, calculados una sola vez sobre el historial de agosto 2026.
# Un numero fijo envejece: cambian los horarios, la epoca del año, se agrega un
# sensor.
#
# Estos ayudantes guardan el valor vigente de cada ambiente. El script
# shell/aprender_movimientos.py los recalcula todas las semanas con la misma
# medicion original (p95 del tiempo quieto adentro, separando las quedadas de las
# salidas mirando si otro sensor detecto algo en el medio), y las automatizaciones
# los leen en vez de tener el numero adentro.
#
# Los valores de arranque son los que se midieron en agosto de 2026.

input_number:
  espera_pasillo:
    name: Espera Pasillo
    icon: mdi:timer-sand
    min: 1
    max: 30
    step: 0.5
    unit_of_measurement: min
    mode: box
    initial: 6

  espera_cocina:
